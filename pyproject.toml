[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-assistant"
version = "1.0.0"
description = "A local-first personal AI assistant with approval-gated workspace tools."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1.0",
  "openwakeword>=0.6.0",
  "sounddevice>=0.4.6",
  "numpy>=1.24",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

# This app is run from its checkout; only its two root Python modules belong
# in the editable distribution. The static/ and reference folders are app data,
# not Python packages that setuptools should auto-discover.
[tool.setuptools]
py-modules = ["jarvis", "voice"]
include-package-data = false
