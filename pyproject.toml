[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-assistant"
version = "1.0.0"
description = "A local-first personal AI assistant with approval-gated workspace tools."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1.0",
  "sounddevice>=0.4.6",
  "numpy>=1.24",
  # JARVIS runs openWakeWord with ONNX. The upstream Linux package also
  # declares tflite-runtime unconditionally, which has no wheels for newer
  # Python versions, so install openwakeword separately with --no-deps.
  "onnxruntime>=1.10.0,<2",
  "tqdm>=4.0,<5",
  "scipy>=1.3,<2",
  "scikit-learn>=1,<2",
  "requests>=2,<3",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

# This app is run from its checkout; only its two root Python modules belong
# in the editable distribution. The static/ and reference folders are app data,
# not Python packages that setuptools should auto-discover.
[tool.setuptools]
py-modules = ["jarvis", "voice"]
include-package-data = false
