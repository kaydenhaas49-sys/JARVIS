<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a10">
  <meta name="description" content="JARVIS — a personal AI chatbot with voice and local wake-word support.">
  <title>J.A.R.V.I.S. — Personal AI</title>
  <link rel="stylesheet" href="/chat.css?v=8">
  <script src="/chat.js?v=7" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="brand-copy"><strong>J.A.R.V.I.S.</strong><span>PERSONAL AI</span></div>
      </div>
      <div class="topbar-right">
        <div class="connection" id="connectionPill" data-state="checking" role="status">
          <span class="connection-dot"></span><span id="connectionLabel">CONNECTING</span>
        </div>
        <button class="control-btn wake-btn" id="wakeWordBtn" type="button" aria-pressed="false" title='Enable local "Hey JARVIS" detection'>
          <span class="control-icon" aria-hidden="true">⌁</span><span id="wakeWordLabel">WAKE OFF</span>
        </button>
        <button class="control-btn voice-btn active" id="voiceOutputBtn" type="button" aria-pressed="true" title="Toggle spoken replies">
          <span class="control-icon" aria-hidden="true">◖))</span><span id="voiceOutputLabel">VOICE ON</span>
        </button>
      </div>
    </header>
    <main class="chat-layout">
      <section class="conversation" aria-label="Chat with JARVIS">
        <div class="welcome" id="welcomePanel">
          <div class="core" id="coreOrb" data-state="idle" aria-hidden="true">
            <div class="dot-sphere" id="dotSphere"></div>
          </div>
          <div class="welcome-kicker"><span></span> PERSONAL ASSISTANT ONLINE <span></span></div>
          <h1>Good to have you back.</h1>
          <p>What can I do for you?</p>
          <div class="welcome-status" id="activityStatus" data-state="idle"><span></span><strong id="activityLabel">READY WHEN YOU ARE</strong></div>
          <div class="wake-hint" id="wakeHint">Type a message, use the microphone, or enable <b>Hey JARVIS</b>.</div>
        </div>
        <div class="chat-log" id="chatLog" aria-live="polite" aria-label="Conversation"></div>
        <div class="typing-row hidden" id="typingRow" role="status">
          <span class="typing-orb" aria-hidden="true"></span><span>JARVIS is thinking</span><i></i><i></i><i></i>
        </div>
      </section>
      <footer class="composer-zone">
        <form class="composer-shell" id="composerForm">
          <textarea id="messageInput" rows="1" maxlength="20000" placeholder="Message JARVIS…" aria-label="Message JARVIS"></textarea>
          <button class="mic-btn" id="micBtn" type="button" aria-label="Start voice input" title="Record a voice message">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"></path></svg>
          </button>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message" title="Send message">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"></path></svg>
          </button>
        </form>
        <div class="composer-footer">
          <span id="composerStatus">ENTER TO SEND <i>·</i> SHIFT + ENTER FOR NEW LINE</span>
          <button id="newChatBtn" type="button" class="new-chat-btn">NEW CHAT ↗</button>
          <span>JARVIS CAN MAKE MISTAKES</span>
        </div>
      </footer>
    </main>
    <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
