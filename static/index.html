<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="JARVIS — your local-first AI assistant.">
  <title>JARVIS — LCARS Command Interface</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/lcars.css?v=6">
  <script src="/jarvis-orb.js?v=4" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>New conversation</span><kbd>⌘ K</kbd>
      </button>

      <div class="sidebar-section">
        <div class="section-label">SYSTEM</div>
        <div class="nav-item selected"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v4h4M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Assistant</span><span class="nav-dot"></span></div>
        <button class="nav-item nav-button" id="systemBtn" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 21h8m-4-4v4M7 9h3m-3 3h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span>System status</span></button>
      </div>

      <div class="sidebar-spacer"></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="menuBtn" type="button" aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <div class="breadcrumb"><span>JARVIS</span><span class="crumb-slash">/</span><strong>Assistant</strong></div>
        </div>
        <div class="topbar-actions">
          <div class="connection-pill" id="connectionPill"><span class="connection-dot"></span><span id="connectionLabel">CHECKING MODEL</span></div>
          <button class="top-action" id="testModelBtn" type="button" title="Test the model connection"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M6.2 9a6.5 6.5 0 0 1 10.7-2L20 12M4 12l3.1 5a6.5 6.5 0 0 0 10.7-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Test link</span></button>
          <button class="top-action voice-output-btn" id="voiceOutputBtn" type="button" aria-pressed="false" title="Toggle spoken replies"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 9a5 5 0 0 1 0 6M19.5 6.5a9 9 0 0 1 0 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Voice off</span></button>
        </div>
      </header>

      <section class="conversation-viewport" id="conversationViewport">
        <section class="welcome-panel" id="welcomePanel" aria-label="JARVIS ambient core display"></section>

        <div class="chat-log" id="chatLog" aria-live="polite" aria-label="Conversation"></div>
        <div class="typing-row hidden" id="typingRow"><span class="typing-avatar">J</span><span class="typing-label">JARVIS is thinking</span><span class="typing-dots"><i></i><i></i><i></i></span></div>
      </section>

      <footer class="composer-zone">
        <div class="composer-shell">
          <div class="composer-topline"><span class="composer-lock"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.5"/></svg></span><span>PRIVATE SESSION</span><span class="composer-topline-divider">/</span><span>WORKSPACE TOOLS ENABLED</span><span class="composer-spacer"></span><span class="composer-shortcut">ENTER TO SEND</span></div>
          <div class="composer-main">
            <textarea id="messageInput" rows="1" placeholder="Message JARVIS…" aria-label="Message JARVIS"></textarea>
            <div class="composer-buttons">
              <button class="mic-btn" id="micBtn" type="button" aria-label="Use voice input" title="Voice input"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
              <button class="send-btn" id="sendBtn" type="button" aria-label="Send message" title="Send message"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
        </div>
        <div class="composer-disclaimer">AI can make mistakes. Review important information and every proposed action.</div>
      </footer>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="mobile-scrim" id="mobileScrim"></div>
</body>
</html>
