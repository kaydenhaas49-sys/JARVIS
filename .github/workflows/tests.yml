name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify editable install metadata
        run: python -m pip install --no-deps -e .
      - name: Verify optional voice dependencies resolve
        run: python -m pip install --dry-run -e ".[voice]"
      - name: Verify wake-word wrapper install without TFLite
        run: python -m pip install --no-deps "openwakeword>=0.6.0"
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/jarvis-orb.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
